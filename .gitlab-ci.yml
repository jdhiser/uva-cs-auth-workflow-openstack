
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
  BUILDX_CACHE_DIR: .docker-cache   # local-only; never uploaded
  # Pull `human/` (and any future nested submodules) at checkout time so
  # the Dockerfile's `COPY . /app` includes the pyhuman source. Without
  # this, post-deploy's build_workflows_zip() step raises because the
  # submodule directory is empty.
  GIT_SUBMODULE_STRATEGY: recursive

build_and_test:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  tags: ["docker"]
  # NOTE: no 'cache:' block and no 'artifacts:' → nothing goes to GitLab
  before_script:
    - |
      set -euo pipefail
      docker context create dind --docker "host=${DOCKER_HOST},ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem" 
      docker buildx create --name ci-builder --use dind || docker buildx use ci-builder
      docker buildx inspect --bootstrap
  script:
    - |
      set -x
      ls -la
      env
      docker buildx build \
        --build-arg OS_PASSWORD="$OS_PASSWORD" \
        --progress=plain \
        --cache-from=type=local,src="${BUILDX_CACHE_DIR}" \
        --cache-to=type=local,dest="${BUILDX_CACHE_DIR}",mode=max \
        -t "${IMAGE_NAME}" \
        --load \
        .
      docker run --rm -t "${IMAGE_NAME}"
  timeout: 3h

  cache: { policy: pull }   # never push


